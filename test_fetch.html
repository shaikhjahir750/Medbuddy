<!DOCTYPE html>
<html>
<body>
<script>
async function test() {
    try {
        const response = await fetch('/does-not-exist');
        console.log("Status:", response.status);
        const data = await response.json();
        console.log("Data:", data);
    } catch (e) {
        console.error("Error:", e.message);
    }
}
test();
</script>
</body>
</html>
